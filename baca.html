
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Buku Cerita - Kit Budi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fc;
            color: #263f78;
        }

        /* HEADER */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: white;
        }

        .logo {
            width: 75px;
            height: auto;
        }

        button {
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        /* HALAMAN UTAMA */

        .home {
            background: #ed9c2f;
            padding: 18px 32px;
            font-size: 18px;
        }

        .home:hover {
            background: #d88720;
        }

        /* TAJUK BUKU */

        .book-heading {
            text-align: center;
            padding: 15px;
        }

        .book-heading h2 {
            margin: 5px;
            font-size: 28px;
        }

        .book-heading p {
            font-size: 14px;
        }

        /* BUTANG FULLSCREEN - SIMBOL SAHAJA */

        .fullscreen-container {
            text-align: center;
            margin: 5px 0 15px;
        }

        .fullscreen-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: #4260b0;
            width: 64px;
            height: 54px;
            padding: 0;
            font-size: 30px;
            line-height: 1;
            border-radius: 40px;
        }

        .fullscreen-btn:hover {
            background: #263f78;
        }

        /* PAPARAN BUKU */

        .book-frame {
            display: block;
            width: 100%;
            height: 75vh;
            border: none;
            background: white;
        }

        /* FULLSCREEN BUKU SAHAJA */

        .book-frame:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border: none;
            background: white;
        }

        .book-frame:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            border: none;
            background: white;
        }

        /* BUTANG BAWAH */

        .bottom-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            padding: 20px;
        }

        .bottom-buttons button {
            padding: 18px 32px;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.3;
            border-radius: 40px;
        }

        .back {
            background: #777;
        }

        .back:hover {
            background: #5f5f5f;
        }

        .next {
            background: #299b63;
        }

        .next:hover {
            background: #21804f;
        }

        /* TABLET */

        @media (max-width: 1000px) {

            .home {
                padding: 16px 25px;
                font-size: 16px;
            }

            .fullscreen-btn {
                width: 60px;
                height: 50px;
                font-size: 27px;
            }

            .bottom-buttons button {
                padding: 16px 26px;
                font-size: 17px;
            }
        }

        /* TELEFON */

        @media (max-width: 600px) {

            header {
                padding: 10px 12px;
                gap: 10px;
            }

            .logo {
                width: 60px;
            }

            .home {
                padding: 13px 18px;
                font-size: 14px;
            }

            .book-heading {
                padding: 12px;
            }

            .book-heading h2 {
                font-size: 23px;
            }

            .fullscreen-container {
                margin: 8px 0 15px;
                padding: 0 10px;
            }

            .fullscreen-btn {
                width: 54px;
                height: 48px;
                font-size: 25px;
            }

            .book-frame {
                height: 70vh;
            }

            .bottom-buttons {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 18px 12px;
            }

            .bottom-buttons button {
                width: 100%;
                padding: 15px 18px;
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <img src="assets/images/logo-kit-budi.jpg"
             class="logo"
             alt="Logo Kit Budi">

        <button class="home"
                onclick="location.href='index.html'">

            🏠 HALAMAN UTAMA

        </button>

    </header>


    <!-- TAJUK BUKU -->

    <div class="book-heading">

        <h2>📖 MASA MEMBACA!</h2>

        <p id="bookTitle"></p>

    </div>


    <!-- BUTANG FULLSCREEN SIMBOL SAHAJA -->

    <div class="fullscreen-container">

        <button class="fullscreen-btn"
                id="fullscreenButton"
                type="button"
                aria-label="Besarkan buku"
                title="Besarkan buku">

            ⛶

        </button>

    </div>


    <!-- PAPARAN BUKU -->

    <iframe
        id="bookFrame"
        class="book-frame"
        title="Buku cerita pilihan"
        allowfullscreen
        webkitallowfullscreen
        allow="fullscreen">
    </iframe>


    <!-- BUTANG BAWAH -->

    <div class="bottom-buttons">

        <button class="back"
                onclick="location.href='pilihbuku.html'">

            ↩ KEMBALI KE PILIH BUKU

        </button>


        <button class="next"
                id="continueButton">

            SAYA SUDAH SELESAI MEMBACA →
            TERUSKAN KE PERMAINAN

        </button>

    </div>


    <script>

        // ======================================
        // MAKLUMAT BUKU
        // ======================================

        const bookUrl =
            sessionStorage.getItem("selectedBookUrl");

        const bookTitle =
            sessionStorage.getItem("selectedBookTitle");

        const bookFrame =
            document.getElementById("bookFrame");

        const fullscreenButton =
            document.getElementById("fullscreenButton");


        // ======================================
        // PAPARKAN TAJUK BUKU
        // ======================================

        document.getElementById("bookTitle").textContent =
            bookTitle || "Buku Cerita";


        // ======================================
        // PAPARKAN BUKU
        // ======================================

        if (bookUrl) {

            bookFrame.src = bookUrl;

        } else {

            document.getElementById("bookTitle").textContent =
                "Pautan buku tidak dijumpai. Sila pilih buku semula.";

        }


        // ======================================
        // FULLSCREEN UNTUK SEMUA BUKU
        // ======================================

        fullscreenButton.addEventListener("click", async function () {

            try {

                if (!document.fullscreenElement) {

                    if (bookFrame.requestFullscreen) {

                        await bookFrame.requestFullscreen();

                    } else if (bookFrame.webkitRequestFullscreen) {

                        bookFrame.webkitRequestFullscreen();

                    } else {

                        alert("Fullscreen tidak disokong oleh pelayar ini.");

                    }

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.error("Fullscreen error:", error);

                alert("Maaf, fullscreen tidak dapat dibuka. Sila cuba sekali lagi.");

            }

        });


        // ======================================
        // KEKALKAN SIMBOL FULLSCREEN
        // ======================================

        function updateFullscreenButton() {

            fullscreenButton.textContent = "⛶";

        }

        document.addEventListener(
            "fullscreenchange",
            updateFullscreenButton
        );

        document.addEventListener(
            "webkitfullscreenchange",
            updateFullscreenButton
        );


        // ======================================
        // TERUSKAN KE PERMAINAN
        // ======================================

        document.getElementById("continueButton")
            .addEventListener("click", function () {

                if (!bookUrl) {

                    alert("Sila pilih buku terlebih dahulu.");

                    return;

                }

                location.href = "pilihpermainan.html";

            });

    </script>

</body>
</html>
