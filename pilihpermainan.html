
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilih Permainan - Kit Budi</title>

    <script src="js/data.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body.activity-selection-page {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        /* ========================================
           BACKGROUND TAHAP RENDAH
        ======================================== */

        body.low-level-games-page {
            position: relative;
            min-height: 100vh;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            background: #dcecff;
        }

        body.low-level-games-page::before {
            content: "";
            position: fixed;
            inset: -8px;
            z-index: 0;
            pointer-events: none;
            background-image: url("assets/images/background-pilihpermainanrendah.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(2px);
            transform: scale(1.02);
        }

        body.low-level-games-page::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.10);
        }

        /* ========================================
           BACKGROUND TAHAP SEDERHANA
        ======================================== */

        body.medium-level-games-page {
            position: relative;
            min-height: 100vh;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            background: #dcecff;
        }

        body.medium-level-games-page::before {
            content: "";
            position: fixed;
            inset: -8px;
            z-index: 0;
            pointer-events: none;
            background-image: url("assets/images/background-pilihpermainansederhana.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(2px);
            transform: scale(1.02);
        }

        body.medium-level-games-page::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.10);
        }

        /* ========================================
           LOGO KIT BUDI
        ======================================== */

        body.activity-selection-page .activity-logo {
            position: absolute !important;
            top: 15px !important;
            left: 25px !important;
            width: 75px !important;
            height: auto !important;
            z-index: 20 !important;
            display: block;
        }

        /* ========================================
           BUTANG MUZIK DAN HALAMAN UTAMA
        ======================================== */

        body.activity-selection-page .activity-top-buttons {
            position: absolute !important;
            top: 20px !important;
            right: 25px !important;
            left: auto !important;

            display: flex !important;
            flex-direction: row !important;
            justify-content: flex-end !important;
            align-items: center !important;
            flex-wrap: wrap;

            gap: 12px !important;

            width: auto !important;
            margin: 0 !important;
            padding: 0 !important;

            z-index: 30 !important;
        }

        /* SAIZ STANDARD DESKTOP */
        body.activity-selection-page .activity-top-buttons button {
            position: static !important;
            width: auto !important;
            min-width: 0 !important;

            padding: 18px 32px !important;
            min-height: 68px !important;

            border: none !important;
            border-radius: 30px !important;

            color: white !important;
            font-size: 18px !important;
            font-weight: bold !important;

            cursor: pointer;
            white-space: nowrap;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        body.activity-selection-page .music-btn {
            background: #405caa !important;
        }

        body.activity-selection-page .home-btn {
            background: #e49b35 !important;
        }

        body.activity-selection-page .activity-top-buttons button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        /* ========================================
           KANDUNGAN UTAMA
        ======================================== */

        body.low-level-games-page .activity-content,
        body.medium-level-games-page .activity-content {
            position: relative;
            z-index: 2;

            width: 100% !important;
            max-width: 1650px !important;

            min-height: 100vh !important;
            height: auto !important;

            margin: 0 auto !important;
            padding: 125px 35px 30px !important;

            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: center !important;

            gap: 20px !important;
        }

        /* ========================================
           TAJUK PILIH PERMAINAN
        ======================================== */

        body.low-level-games-page .activity-heading,
        body.medium-level-games-page .activity-heading {
            position: relative;
            z-index: 2;

            width: 100% !important;
            text-align: center;

            margin: 0 !important;
            padding: 0 !important;

            flex: 0 0 auto !important;
        }

        body.low-level-games-page .activity-heading h1,
        body.medium-level-games-page .activity-heading h1 {
            color: #263b70;
            font-size: clamp(32px, 3vw, 44px) !important;
            margin: 0 0 8px !important;
            font-weight: 800;
            text-shadow: 0 2px 5px rgba(255, 255, 255, 0.85);
        }

        body.low-level-games-page .activity-heading p,
        body.medium-level-games-page .activity-heading p {
            color: #263b70;
            font-size: 18px !important;
            margin: 0 !important;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
        }

        /* ========================================
           CONTAINER KAD PERMAINAN
        ======================================== */

        body.low-level-games-page .PERMAINAN-container,
        body.medium-level-games-page .PERMAINAN-container {
            position: relative;
            z-index: 2;

            width: 100% !important;
            max-width: 1450px !important;

            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            align-items: stretch !important;
            flex-wrap: nowrap !important;

            gap: 25px !important;

            margin: 0 auto !important;
            padding: 5px 0 !important;

            flex: 0 0 auto !important;
            min-height: 0;
        }

        /* ========================================
           KAD PERMAINAN
        ======================================== */

        body.low-level-games-page .PERMAINAN-card,
        body.medium-level-games-page .PERMAINAN-card {
            position: relative;

            flex: 1 1 0 !important;

            width: auto !important;
            max-width: none !important;
            min-width: 0 !important;

            height: 390px !important;
            min-height: 390px !important;

            padding: 18px 20px 20px !important;

            background: rgba(255, 255, 255, 0.94) !important;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 23px !important;

            box-shadow: 0 8px 25px rgba(50, 60, 90, 0.17);

            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: center !important;

            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        body.low-level-games-page .PERMAINAN-card:hover,
        body.medium-level-games-page .PERMAINAN-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(50, 60, 90, 0.22);
        }

        body.low-level-games-page .PERMAINAN-card-content,
        body.medium-level-games-page .PERMAINAN-card-content {
            width: 100% !important;

            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;

            text-align: center;
            flex: 0 0 auto;
        }

        /* ========================================
           GAMBAR PERMAINAN
        ======================================== */

        body.low-level-games-page .PERMAINAN-image,
        body.medium-level-games-page .PERMAINAN-image {
            display: block;
            width: 100% !important;
            height: 190px !important;

            object-fit: contain !important;
            border-radius: 15px;

            background: rgba(240, 244, 250, 0.85);
            margin: 0 0 12px !important;
        }

        body.low-level-games-page .PERMAINAN-icon,
        body.medium-level-games-page .PERMAINAN-icon {
            width: 100%;
            height: 190px;

            justify-content: center;
            align-items: center;

            font-size: 65px;
        }

        /* ========================================
           NAMA PERMAINAN
        ======================================== */

        body.low-level-games-page .PERMAINAN-card h2,
        body.medium-level-games-page .PERMAINAN-card h2 {
            width: 100%;
            color: #263b70;

            font-size: clamp(18px, 1.5vw, 23px) !important;

            text-align: center;
            margin: 8px 0 12px !important;
            line-height: 1.35;
        }

        /* ========================================
           BUTANG MAIN PERMAINAN
           SAIZ SAMA DENGAN HALAMAN LAIN
        ======================================== */

        body.low-level-games-page .PERMAINAN-btn,
        body.medium-level-games-page .PERMAINAN-btn {
            display: inline-flex !important;
            justify-content: center !important;
            align-items: center !important;

            width: 75% !important;
            max-width: 260px !important;

            min-height: 68px !important;
            margin-top: auto !important;

            padding: 18px 32px !important;

            border: none !important;
            border-radius: 30px !important;

            background: #405caa !important;
            color: white !important;

            font-size: 18px !important;
            font-weight: bold !important;

            line-height: 1.3;
            text-align: center;

            cursor: pointer;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            transition: 0.2s ease;
        }

        body.low-level-games-page .PERMAINAN-btn:hover,
        body.medium-level-games-page .PERMAINAN-btn:hover {
            background: #2d4382 !important;
            transform: translateY(-3px);
        }

        /* ========================================
           BUTANG PILIH BUKU DAN RAK BUKU
           KEDUDUKAN DI BAWAH KAD
        ======================================== */

        body.low-level-games-page .back-container,
        body.medium-level-games-page .back-container {
            position: relative !important;
            z-index: 5 !important;

            display: flex !important;
            justify-content: center !important;
            align-items: center !important;

            flex-direction: row !important;
            flex-wrap: wrap !important;

            gap: 14px !important;

            width: 100% !important;

            margin: 0 !important;
            padding: 0 0 10px !important;

            flex: 0 0 auto !important;
        }

        body.low-level-games-page .back-btn,
        body.medium-level-games-page .back-btn {
            position: relative !important;

            display: inline-flex !important;
            justify-content: center !important;
            align-items: center !important;

            width: auto !important;
            min-width: 0 !important;
            min-height: 68px !important;

            padding: 18px 32px !important;

            border: none !important;
            border-radius: 30px !important;

            background: #777 !important;
            color: white !important;

            text-decoration: none !important;

            font-size: 18px !important;
            font-weight: bold !important;

            line-height: 1.3;
            white-space: nowrap;

            transition: transform 0.2s ease;
        }

        body.low-level-games-page .back-btn:hover,
        body.medium-level-games-page .back-btn:hover {
            transform: scale(1.05);
        }

        /* ========================================
           MESEJ RALAT
        ======================================== */

        body.low-level-games-page .message,
        body.medium-level-games-page .message {
            width: 100%;
            text-align: center;

            font-size: 18px;
            font-weight: bold;

            color: #263b70;

            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
        }

        /* ========================================
           TABLET
           KEKALKAN SAIZ STANDARD BUTANG
        ======================================== */

        @media (max-width: 900px) {

            body.low-level-games-page .activity-content,
            body.medium-level-games-page .activity-content {
                padding: 115px 20px 30px !important;
                gap: 20px !important;
            }

            body.activity-selection-page .activity-logo {
                width: 65px !important;
                left: 15px !important;
            }

            body.activity-selection-page .activity-top-buttons {
                top: 15px !important;
                right: 15px !important;
                gap: 8px !important;
            }

            body.low-level-games-page .activity-heading h1,
            body.medium-level-games-page .activity-heading h1 {
                font-size: 32px !important;
            }

            body.low-level-games-page .PERMAINAN-container,
            body.medium-level-games-page .PERMAINAN-container {
                flex-wrap: wrap !important;
                max-width: 850px !important;
                gap: 20px !important;
            }

            body.low-level-games-page .PERMAINAN-card,
            body.medium-level-games-page .PERMAINAN-card {
                flex: 1 1 42% !important;
                max-width: 420px !important;
                height: 390px !important;
                min-height: 390px !important;
            }
        }

        /* ========================================
           TELEFON
           SAIZ STANDARD SAMA DENGAN HALAMAN LAIN
        ======================================== */

        @media (max-width: 600px) {

            body.activity-selection-page .activity-logo {
                width: 55px !important;
                top: 12px !important;
                left: 12px !important;
            }

            body.activity-selection-page .activity-top-buttons {
                position: relative !important;

                top: auto !important;
                right: auto !important;

                width: 100% !important;

                justify-content: center !important;

                padding: 75px 10px 0 !important;
                gap: 8px !important;
            }

            body.activity-selection-page .activity-top-buttons button {
                min-width: 0 !important;

                padding: 15px 18px !important;
                min-height: 52px !important;

                font-size: 15px !important;
            }

            body.low-level-games-page .activity-content,
            body.medium-level-games-page .activity-content {
                min-height: auto !important;

                padding: 20px 15px 25px !important;
                gap: 18px !important;
            }

            body.low-level-games-page .activity-heading h1,
            body.medium-level-games-page .activity-heading h1 {
                font-size: 25px !important;
            }

            body.low-level-games-page .activity-heading p,
            body.medium-level-games-page .activity-heading p {
                font-size: 14px !important;
                line-height: 1.5;
            }

            body.low-level-games-page .PERMAINAN-container,
            body.medium-level-games-page .PERMAINAN-container {
                flex-direction: column !important;
                align-items: center !important;
                gap: 18px !important;
            }

            body.low-level-games-page .PERMAINAN-card,
            body.medium-level-games-page .PERMAINAN-card {
                flex: none !important;

                width: 100% !important;
                max-width: 360px !important;

                height: 370px !important;
                min-height: 370px !important;

                padding: 18px !important;
            }

            body.low-level-games-page .PERMAINAN-image,
            body.medium-level-games-page .PERMAINAN-image {
                height: 185px !important;
            }

            body.low-level-games-page .PERMAINAN-icon,
            body.medium-level-games-page .PERMAINAN-icon {
                height: 185px;
            }

            body.low-level-games-page .PERMAINAN-card h2,
            body.medium-level-games-page .PERMAINAN-card h2 {
                font-size: 19px !important;
            }

            body.low-level-games-page .PERMAINAN-btn,
            body.medium-level-games-page .PERMAINAN-btn {
                width: 85% !important;

                padding: 15px 18px !important;
                min-height: 52px !important;

                font-size: 15px !important;
            }

            body.low-level-games-page .back-container,
            body.medium-level-games-page .back-container {
                flex-direction: column !important;
                flex-wrap: nowrap !important;

                gap: 12px !important;
                margin-top: 5px !important;
            }

            body.low-level-games-page .back-btn,
            body.medium-level-games-page .back-btn {
                width: 85% !important;
                max-width: 300px !important;

                padding: 15px 18px !important;
                min-height: 52px !important;

                font-size: 15px !important;
            }
        }

        /* ========================================
           LAPTOP SKRIN PENDEK
           SUSUNAN BOLEH SCROLL, TIDAK BERTINDIH
        ======================================== */

        @media (min-width: 901px) and (max-height: 750px) {

            body.low-level-games-page .activity-content,
            body.medium-level-games-page .activity-content {
                padding-top: 115px !important;
                padding-bottom: 25px !important;
                gap: 15px !important;
            }

            body.low-level-games-page .PERMAINAN-card,
            body.medium-level-games-page .PERMAINAN-card {
                height: 350px !important;
                min-height: 350px !important;
            }

            body.low-level-games-page .PERMAINAN-image,
            body.medium-level-games-page .PERMAINAN-image {
                height: 165px !important;
            }

            body.low-level-games-page .PERMAINAN-icon,
            body.medium-level-games-page .PERMAINAN-icon {
                height: 165px;
            }
        }

    </style>
</head>

<body class="activity-selection-page">

    <!-- LOGO -->
    <img
        src="assets/images/logo-kit-budi.jpg"
        class="activity-logo"
        alt="Logo Kit Budi"
    >

    <!-- BUTANG ATAS -->
    <div class="activity-top-buttons">

        <button
            class="music-btn"
            id="musicButton"
            type="button">
            🔇 MUZIK OFF
        </button>

        <button
            class="home-btn"
            type="button"
            onclick="window.location.href='index.html'">
            🏠 HALAMAN UTAMA
        </button>

    </div>

    <!-- KANDUNGAN UTAMA -->
    <main class="activity-content">

        <!-- TAJUK -->
        <div class="activity-heading">

            <h1>🎮 PILIH PERMAINAN</h1>

            <p id="bookDescription">
                Pilih satu permainan untuk dimainkan.
            </p>

        </div>

        <!-- SENARAI PERMAINAN -->
        <div
            class="PERMAINAN-container"
            id="PERMAINANContainer">
        </div>

        <!-- BUTANG KEMBALI -->
        <div class="back-container">

            <a
                href="pilihbuku.html"
                class="back-btn">
                ↩ PILIH BUKU
            </a>

            <a
                href="rakbuku.html"
                class="back-btn">
                📚 RAK BUKU
            </a>

        </div>

    </main>

    <!-- AUDIO -->
    <audio
        id="backgroundMusic"
        src="assets/audio/lagu-kit-budi.mp3"
        loop>
    </audio>

    <script>

        /* ========================================
           DATA PILIHAN
        ======================================== */

        const selectedLevel =
            sessionStorage.getItem("selectedLevel");

        const selectedBookId =
            sessionStorage.getItem("selectedBookId");

        const PERMAINANContainer =
            document.getElementById("PERMAINANContainer");

        const bookDescription =
            document.getElementById("bookDescription");


        /* ========================================
           PILIH BACKGROUND MENGIKUT TAHAP
        ======================================== */

        if (selectedLevel === "rendah") {

            document.body.classList.add(
                "low-level-games-page"
            );

        } else if (selectedLevel === "sederhana") {

            document.body.classList.add(
                "medium-level-games-page"
            );

        }


        /* ========================================
           SISTEM MUZIK
        ======================================== */

        const music =
            document.getElementById("backgroundMusic");

        const musicButton =
            document.getElementById("musicButton");

        music.loop = true;

        let musicPlaying = false;

        musicButton.addEventListener(
            "click",
            async function () {

                if (!musicPlaying) {

                    try {

                        await music.play();

                        musicPlaying = true;

                        musicButton.textContent =
                            "🔊 MUZIK ON";

                    } catch (error) {

                        alert(
                            "Muzik tidak dapat dimainkan."
                        );

                    }

                } else {

                    music.pause();

                    musicPlaying = false;

                    musicButton.textContent =
                        "🔇 MUZIK OFF";

                }

            }
        );


        /* ========================================
           PILIH GAMBAR MENGIKUT BUKU
        ======================================== */

        function getGameImage(gameTitle, bookTitle, index) {

            const title =
                gameTitle.toLowerCase().trim();

            const book =
                bookTitle.toLowerCase().trim();


            /* ARNAB DAN KURA-KURA */

            if (
                book.includes("arnab") &&
                book.includes("kura")
            ) {

                const arnabImages = [

                    "assets/images/susunaksara.jpeg",

                    "assets/images/misikurakura.jpeg",

                    "assets/images/sebutanmagis.jpeg"

                ];

                return arnabImages[index] || null;

            }


            /* KAD HURUF MISTERI */

            if (title.includes("kad huruf misteri")) {

                return "assets/images/kadhurufmisteri.jpeg";

            }


            /* KEMBARA BATU BELAH */

            if (
                title.includes("kembara batu belah") ||
                title.includes("batu belah")
            ) {

                return "assets/images/kembarabatubelah.jpeg";

            }


            /* MARI MENGEJA */

            if (
                title.includes("mari mengeja") ||
                title.includes("mengeja suku kata")
            ) {

                return "assets/images/marimengejasukukata.jpeg";

            }


            return null;

        }


        /* ========================================
           PAPARKAN PERMAINAN
        ======================================== */

        if (
            !selectedLevel ||
            !learningData[selectedLevel]
        ) {

            PERMAINANContainer.innerHTML =
                '<p class="message">' +
                'Sila pilih tahap pembelajaran dahulu.' +
                '</p>';

        } else {

            const books =
                learningData[selectedLevel];

            const selectedBook =
                books.find(function (book) {

                    return book.id === selectedBookId;

                });


            if (!selectedBook) {

                PERMAINANContainer.innerHTML =
                    '<p class="message">' +
                    'Buku tidak dijumpai. ' +
                    'Sila pilih buku semula.' +
                    '</p>';

            } else {

                bookDescription.textContent =
                    selectedBook.title +
                    " - Pilih satu daripada 3 permainan.";


                selectedBook.PERMAINANs.forEach(
                    function (PERMAINAN, index) {

                        const card =
                            document.createElement("div");

                        card.className =
                            "PERMAINAN-card";


                        /* GAMBAR PERMAINAN */

                        const imagePath =
                            getGameImage(
                                PERMAINAN.title,
                                selectedBook.title,
                                index
                            );


                        card.innerHTML = `

                            <div class="PERMAINAN-card-content">

                                <img
                                    src="${imagePath || ''}"
                                    class="PERMAINAN-image"
                                    alt="Gambar ${PERMAINAN.title}"
                                    style="${imagePath ? '' : 'display:none;'}"
                                >

                                <div
                                    class="PERMAINAN-icon"
                                    style="display:${imagePath ? 'none' : 'flex'};"
                                >
                                    🎮
                                </div>

                                <h2>
                                    ${PERMAINAN.title}
                                </h2>

                            </div>

                            <button
                                class="PERMAINAN-btn"
                                type="button">
                                MAIN PERMAINAN ${index + 1}
                            </button>

                        `;


                        /* JIKA GAMBAR TIDAK DIJUMPAI */

                        const gameImage =
                            card.querySelector(".PERMAINAN-image");

                        gameImage.addEventListener(
                            "error",
                            function () {

                                gameImage.style.display = "none";

                                gameImage.nextElementSibling.style.display =
                                    "flex";

                            }
                        );


                        /* BUTANG MAIN PERMAINAN */

                        card
                            .querySelector(".PERMAINAN-btn")
                            .addEventListener(
                                "click",
                                function () {

                                    sessionStorage.setItem(
                                        "selectedPERMAINANTitle",
                                        PERMAINAN.title
                                    );

                                    sessionStorage.setItem(
                                        "selectedPERMAINANUrl",
                                        PERMAINAN.url
                                    );

                                    sessionStorage.setItem(
                                        "selectedPERMAINANIndex",
                                        index
                                    );

                                    window.location.href =
                                        "mainpermainan.html";

                                }
                            );


                        PERMAINANContainer.appendChild(card);

                    }
                );

            }

        }

    </script>
