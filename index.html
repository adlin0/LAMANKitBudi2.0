
<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIT BUDI - Pengembaraan Cerita Rakyat</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .home-page {
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #f8f1df;
        }

        /* LOGO */

        .logo-container {
            position: absolute;
            top: 18px;
            left: 25px;
            z-index: 10;
        }

        .logo {
            width: 90px;
            height: auto;
            display: block;
        }

        /* BUTANG MUZIK */

        .music-button {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 10;

            border: none;
            border-radius: 40px;
            padding: 26px 44px;

            background: #2f7d65;
            color: white;

            font-size: 32px;
            font-weight: bold;

            cursor: pointer;
            white-space: nowrap;

            transition: transform 0.2s ease;
        }

        .music-button:hover {
            transform: scale(1.05);
        }

        /* GAMBAR UTAMA */

        .home-content {
            width: 100%;
            height: 100vh;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .adventure-image {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* BUTANG MULA PENGEMBARAAN */

        .start-button {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            border: none;
            border-radius: 40px;
            padding: 36px 84px;

            background: #f36f52;
            color: white;

            font-size: 34px;
            font-weight: bold;

            cursor: pointer;
            z-index: 10;

            white-space: nowrap;

            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);

            transition: transform 0.2s ease;
        }

        .start-button:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* TABLET */

        @media (max-width: 1000px) {

            .music-button {
                padding: 20px 30px;
                font-size: 25px;
            }

            .start-button {
                padding: 28px 55px;
                font-size: 27px;
            }
        }

        /* TELEFON */

        @media (max-width: 768px) {

            .logo-container {
                top: 12px;
                left: 15px;
            }

            .logo {
                width: 65px;
            }

            .music-button {
                top: 15px;
                right: 15px;

                padding: 14px 20px;
                font-size: 18px;
            }

            .start-button {
                bottom: 20px;

                width: calc(100% - 40px);
                max-width: 420px;

                padding: 20px 18px;
                font-size: 21px;

                white-space: normal;
                line-height: 1.3;
            }
        }

        /* TELEFON KECIL */

        @media (max-width: 400px) {

            .logo {
                width: 55px;
            }

            .music-button {
                padding: 12px 15px;
                font-size: 15px;
            }

            .start-button {
                font-size: 18px;
                padding: 17px 14px;
            }
        }

    </style>
</head>

<body>

    <main class="home-page">

        <!-- LOGO KIT BUDI -->

        <div class="logo-container">
            <img
                src="assets/images/logo-kit-budi.jpg"
                alt="Logo KIT BUDI"
                class="logo"
            >
        </div>


        <!-- BUTANG MUZIK -->

        <button
            id="musicButton"
            class="music-button"
            type="button">

            🔇 MUZIK OFF

        </button>


        <!-- MUZIK KIT BUDI -->

        <audio
            id="backgroundMusic"
            src="assets/audio/lagu-kit-budi.mp3"
            loop>
        </audio>


        <!-- GAMBAR UTAMA -->

        <div class="home-content">

            <img
                src="https://lh3.googleusercontent.com/d/1Yi9jnO2YcAM9acSlGIiHrWTnmgs2Plg1"
                alt="Pengembaraan Budi Menelusuri Cerita Rakyat"
                class="adventure-image"
            >


            <!-- BUTANG MULA -->

            <button
                id="startButton"
                class="start-button"
                type="button">

                🚀 MULA PENGEMBARAAN

            </button>

        </div>

    </main>


    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
