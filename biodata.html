
<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIT BUDI - Biodata Pengembara</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            position: relative;
            isolation: isolate;
            background: #fffaf0;
        }

        /* ========================================
           BACKGROUND FANTASY KIT BUDI
        ======================================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image: url("assets/images/background-biodata.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            z-index: -1;
            pointer-events: none;
        }

        /* ========================================
           HALAMAN BIODATA
        ======================================== */

        .biodata-page {
            width: 100%;
            min-height: 100vh;
            padding: 18px 40px;

            text-align: center;
            background: transparent;

            display: flex;
            flex-direction: column;

            position: relative;
            z-index: 1;
        }

        /* ========================================
           HEADER
        ======================================== */

        .biodata-header {
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            position: relative;
            z-index: 10;
        }

        .biodata-logo {
            width: 105px;
            height: auto;
            display: block;
        }

        /* ========================================
           BUTANG MUZIK
        ======================================== */

        .biodata-header .music-button {
            position: static;

            border: none;
            border-radius: 40px;

            padding: 18px 32px;

            background: #2f7d65;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
            white-space: nowrap;

            transition: transform 0.2s ease;
        }

        .biodata-header .music-button:hover {
            transform: scale(1.05);
        }

        /* ========================================
           KANDUNGAN UTAMA
        ======================================== */

        .biodata-content {
            flex: 1;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
            z-index: 2;

            padding: 15px 0;
        }

        /* ========================================
           KAD BIODATA
        ======================================== */

        .biodata-card {
            width: 85%;
            max-width: 1250px;
            min-height: 72vh;

            padding: 50px 70px;
            margin: 0 auto;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 30px;
            border: 2px solid rgba(230, 170, 70, 0.45);

            box-shadow: 0 15px 40px rgba(70, 50, 25, 0.16);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
            z-index: 3;
        }

        /* ========================================
           ICON
        ======================================== */

        .biodata-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        /* ========================================
           TAJUK
        ======================================== */

        .biodata-card h1 {
            color: #263b70;
            font-size: clamp(32px, 3vw, 48px);

            margin: 5px 0 25px;
            letter-spacing: 1px;
        }

        /* ========================================
           PENERANGAN
        ======================================== */

        .biodata-card p {
            max-width: 900px;

            margin: 0 auto 40px;

            color: #555;

            font-size: clamp(17px, 1.4vw, 22px);
            line-height: 1.8;
        }

        /* ========================================
           KUMPULAN BUTANG
        ======================================== */

        .biodata-buttons {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 15px;
        }

        /* SAIZ BUTANG DISELARASKAN DENGAN BACA.HTML */

        .biodata-link,
        .biodata-buttons .home-button,
        .biodata-buttons .next-button {

            width: 350px;
            max-width: 100%;

            min-height: 68px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 18px 32px;

            border: none;
            border-radius: 40px;

            text-decoration: none;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            line-height: 1.3;
        }

        /* ========================================
           WARNA BUTANG
        ======================================== */

        .biodata-link {
            background: #405caa;
        }

        .biodata-buttons .next-button {
            background: #36a653;
        }

        .biodata-buttons .home-button {
            background: #e49b35;
        }

        /* ========================================
           HOVER
        ======================================== */

        .biodata-link:hover,
        .biodata-buttons .home-button:hover,
        .biodata-buttons .next-button:hover {

            transform: translateY(-3px) scale(1.03);

            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.20);
        }

        .biodata-link:hover {
            background: #2d4382;
        }

        .biodata-buttons .home-button:hover {
            background: #c77d1d;
        }

        .biodata-buttons .next-button:hover {
            background: #25813d;
        }

        /* ========================================
           TABLET
        ======================================== */

        @media (max-width: 900px) {

            .biodata-page {
                padding: 18px 25px;
            }

            .biodata-logo {
                width: 90px;
            }

            .biodata-header .music-button {
                padding: 16px 25px;
                font-size: 17px;
            }

            .biodata-card {
                width: 92%;
                min-height: 65vh;
                padding: 45px 35px;
            }

            .biodata-card h1 {
                font-size: 36px;
            }

            .biodata-card p {
                font-size: 18px;
            }

            .biodata-link,
            .biodata-buttons .home-button,
            .biodata-buttons .next-button {
                width: 320px;
                min-height: 64px;
                padding: 17px 25px;
                font-size: 17px;
            }
        }

        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 600px) {

            body::before {
                background-position: center center;
            }

            .biodata-page {
                padding: 12px;
            }

            .biodata-logo {
                width: 70px;
            }

            .biodata-header .music-button {
                padding: 13px 18px;
                font-size: 14px;
            }

            .biodata-content {
                padding: 20px 0;
            }

            .biodata-card {
                width: 96%;
                min-height: auto;

                padding: 35px 18px;
                margin: 15px auto;

                border-radius: 22px;
            }

            .biodata-icon {
                font-size: 50px;
            }

            .biodata-card h1 {
                font-size: 27px;
                margin-bottom: 18px;
            }

            .biodata-card p {
                font-size: 16px;
                line-height: 1.7;
                margin-bottom: 28px;
            }

            .biodata-buttons {
                gap: 12px;
            }

            .biodata-link,
            .biodata-buttons .home-button,
            .biodata-buttons .next-button {

                width: 100%;
                max-width: 320px;

                min-height: 58px;

                padding: 15px 18px;
                font-size: 15px;
            }
        }

    </style>

</head>

<body>

    <main class="biodata-page">

        <!-- HEADER -->

        <header class="biodata-header">

            <img
                src="assets/images/logo-kit-budi.jpg"
                alt="Logo KIT BUDI"
                class="biodata-logo"
            >

            <button
                id="musicButton"
                class="music-button"
                type="button">

                🔇 MUZIK OFF

            </button>

        </header>


        <!-- KANDUNGAN BIODATA -->

        <div class="biodata-content">

            <section class="biodata-card">

                <div class="biodata-icon">
                    🧭
                </div>

                <h1>BIODATA PENGEMBARA</h1>

                <p>
                    Selamat datang ke <strong>Pengembaraan Budi!</strong>
                    Sebelum memulakan perjalanan menelusuri cerita rakyat,
                    isilah biodata anda untuk menyertai pengembaraan ini.
                </p>


                <!-- BUTANG -->

                <div class="biodata-buttons">

                    <a
                        id="biodataLink"
                        class="biodata-link"
                        target="_blank"
                        rel="noopener noreferrer">

                        📝 ISI BIODATA

                    </a>


                    <button
                        class="next-button"
                        type="button"
                        onclick="window.location.href='rakbuku.html'">

                        ➡️ TERUSKAN

                    </button>


                    <button
                        class="home-button"
                        type="button"
                        onclick="window.location.href='index.html'">

                        🏠 HALAMAN UTAMA

                    </button>

                </div>

            </section>

        </div>

    </main>


    <!-- AUDIO -->

    <audio
        id="backgroundMusic"
        src="assets/audio/lagu-kit-budi.mp3"
        loop>
    </audio>


    <!-- JAVASCRIPT -->

    <script src="js/data.js"></script>

    <script>

        const music =
            document.getElementById("backgroundMusic");

        const musicButton =
            document.getElementById("musicButton");

        const biodataLink =
            document.getElementById("biodataLink");

        biodataLink.href = appLinks.biodata;

        let musicPlaying = false;

        musicButton.addEventListener("click", async function () {

            if (!musicPlaying) {

                try {

                    await music.play();

                    musicPlaying = true;

                    musicButton.textContent = "🔊 MUZIK ON";

                } catch (error) {

                    alert("Muzik tidak dapat dimainkan. Sila cuba lagi.");

                }

            } else {

                music.pause();

                musicPlaying = false;

                musicButton.textContent = "🔇 MUZIK OFF";

            }

        });

    </script>

</body>

</html>
