
<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIT BUDI - Video Pengenalan</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* BACKGROUND */

        .intro-page {
            width: 100%;
            min-height: 100vh;
            padding: 20px 4%;
            text-align: center;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.12),
                    rgba(255, 255, 255, 0.12)
                ),
                url("assets/images/background-videointrorendah.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;

            position: relative;
            overflow: hidden;
        }

        /* HEADER */

        .intro-header {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;

            position: relative;
            z-index: 2;
        }

        .intro-logo {
            width: 110px;
            height: auto;
            display: block;
        }

        /* KANDUNGAN UTAMA */

        .intro-content {
            width: 100%;
            max-width: 1500px;
            flex: 1;
            margin: 0 auto;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
            z-index: 2;

            padding: 15px 0;
        }

        /* TAJUK */

        .intro-content h1 {
            color: #263b70;
            font-size: clamp(28px, 2.5vw, 46px);
            margin: 10px 0 12px;

            text-shadow:
                0 2px 5px rgba(255, 255, 255, 0.9);
        }

        .intro-description {
            color: #444;
            font-size: clamp(15px, 1.2vw, 20px);
            line-height: 1.6;
            margin: 0 0 22px;

            text-shadow:
                0 1px 4px rgba(255, 255, 255, 0.9);
        }

        /* VIDEO */

        .video-container {
            width: min(90vw, 1400px);
            max-height: 70vh;

            background: #000;
            border-radius: 20px;
            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

            position: relative;
            z-index: 3;
        }

        .intro-video {
            display: block;
            width: 100%;
            height: min(62vw, 720px);
            max-height: 68vh;

            object-fit: contain;
            background: #000;
        }

        /* MESEJ VIDEO TIDAK DIJUMPAI */

        .video-error {
            display: none;
            width: min(90vw, 1400px);

            padding: 25px;

            background: #fff0e8;
            color: #a33b20;

            border: 1px solid #e9b9a8;
            border-radius: 12px;

            font-size: 16px;
            line-height: 1.6;
        }

        /* BUTANG */

        .intro-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

            gap: 18px;
            margin-top: 22px;
            margin-bottom: 15px;

            position: relative;
            z-index: 3;
        }

        /* SAIZ BUTANG DISELARASKAN DENGAN BACA.HTML */

        .intro-button {
            min-width: 350px;
            min-height: 68px;

            padding: 28px 48px;

            border: none;
            border-radius: 40px;

            color: white;
            font-weight: bold;
            font-size: 32px;

            cursor: pointer;
            text-decoration: none;

            display: inline-flex;
            justify-content: center;
            align-items: center;

            line-height: 1.3;
            text-align: center;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        /* WARNA BUTANG */

        .home-button {
            background: #e49b35;
        }

        .back-button {
            background: #777;
        }

        .next-button {
            background: #36a653;
        }

        /* HOVER */

        .intro-button:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .home-button:hover {
            background: #c77d1d;
        }

        .back-button:hover {
            background: #555;
        }

        .next-button:hover {
            background: #25813d;
        }

        /* TABLET */

        @media (max-width: 900px) {

            .intro-page {
                padding: 20px 4%;
                background-attachment: scroll;
            }

            .intro-logo {
                width: 90px;
            }

            .intro-content h1 {
                font-size: 30px;
            }

            .video-container {
                width: 92vw;
            }

            .intro-video {
                height: 55vw;
                max-height: 60vh;
            }

            .intro-button {
                min-width: 300px;
                padding: 22px 32px;
                font-size: 26px;
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .intro-page {
                padding: 15px;
                background-attachment: scroll;
            }

            .intro-logo {
                width: 75px;
            }

            .intro-content {
                justify-content: flex-start;
                padding-top: 20px;
            }

            .intro-content h1 {
                font-size: 24px;
                margin-top: 10px;
            }

            .intro-description {
                font-size: 14px;
                line-height: 1.6;
            }

            .video-container {
                width: 100%;
                border-radius: 15px;
            }

            .intro-video {
                width: 100%;
                height: auto;
                max-height: 55vh;
            }

            .video-error {
                width: 100%;
                font-size: 14px;
            }

            .intro-buttons {
                width: 100%;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                margin-top: 20px;
            }

            .intro-button {
                width: 100%;
                max-width: 420px;
                min-width: unset;
                min-height: 58px;

                padding: 20px 18px;
                font-size: 22px;
            }
        }

        /* TELEFON KECIL */

        @media (max-width: 400px) {

            .intro-button {
                font-size: 18px;
                padding: 17px 14px;
            }
        }

    </style>

</head>

<body>

    <main class="intro-page">

        <!-- HEADER -->

        <header class="intro-header">

            <img
                src="assets/images/logo-kit-budi.jpg"
                alt="Logo KIT BUDI"
                class="intro-logo"
            >

        </header>


        <!-- KANDUNGAN UTAMA -->

        <section class="intro-content">

            <h1 id="levelTitle">
                VIDEO PENGENALAN
            </h1>


            <p
                class="intro-description"
                id="levelDescription">

                Tonton video pengenalan sebelum meneruskan pengembaraan.

            </p>


            <!-- VIDEO -->

            <div
                class="video-container"
                id="videoContainer">

                <video
                    id="introVideo"
                    class="intro-video"
                    controls
                    playsinline
                    preload="metadata">

                    Browser anda tidak menyokong video.

                </video>

            </div>


            <!-- MESEJ JIKA VIDEO TIDAK DIJUMPAI -->

            <div
                class="video-error"
                id="videoError">

                Video tidak dapat dipaparkan.

                Sila pastikan fail video berada dalam folder
                <strong>videos</strong> dan nama fail adalah betul.

            </div>


            <!-- BUTANG -->

            <div class="intro-buttons">

                <button
                    class="intro-button home-button"
                    type="button"
                    onclick="window.location.href='index.html'">

                    🏠 HALAMAN UTAMA

                </button>


                <button
                    class="intro-button back-button"
                    type="button"
                    onclick="window.location.href='rakbuku.html'">

                    ↩ KEMBALI KE RAK BUKU

                </button>


                <button
                    class="intro-button next-button"
                    type="button"
                    onclick="goToBooks()">

                    ➡️ TERUSKAN KE PILIH BUKU

                </button>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        /* AMBIL TAHAP PEMBELAJARAN */

        const selectedLevel =
            sessionStorage.getItem("selectedLevel");

        const video =
            document.getElementById("introVideo");

        const title =
            document.getElementById("levelTitle");

        const description =
            document.getElementById("levelDescription");

        const videoContainer =
            document.getElementById("videoContainer");

        const videoError =
            document.getElementById("videoError");


        /* TETAPKAN VIDEO MENGIKUT TAHAP */

        if (selectedLevel === "rendah") {

            title.textContent =
                "🌱 VIDEO PENGENALAN - TAHAP RENDAH";

            description.textContent =
                "Tonton video pengenalan Tahap Rendah sebelum memilih buku cerita.";

            video.src =
                "assets/videos/introRENDAH.MP4";

        }

        else if (selectedLevel === "sederhana") {

            title.textContent =
                "🌳 VIDEO PENGENALAN - TAHAP SEDERHANA";

            description.textContent =
                "Tonton video pengenalan Tahap Sederhana sebelum memilih buku cerita.";

            video.src =
                "assets/videos/introSEDERHANA.mp4";

        }

        else {

            title.textContent =
                "TAHAP BELUM DIPILIH";

            description.textContent =
                "Sila kembali ke Rak Buku dan pilih tahap pembelajaran.";

            videoContainer.style.display = "none";

            videoError.style.display = "block";

        }


        /* MUATKAN VIDEO */

        if (
            selectedLevel === "rendah" ||
            selectedLevel === "sederhana"
        ) {

            video.load();

        }


        /* SEMAK JIKA VIDEO TIDAK DAPAT DIMUATKAN */

        video.addEventListener("error", function () {

            videoContainer.style.display = "none";

            videoError.style.display = "block";

        });


        /* TERUSKAN KE PILIH BUKU */

        function goToBooks() {

            if (!selectedLevel) {

                alert(
                    "Sila pilih tahap pembelajaran terlebih dahulu."
                );

                window.location.href =
                    "rakbuku.html";

                return;

            }

            window.location.href =
                "pilihbuku.html";

        }

    </script>

</body>

</html>
